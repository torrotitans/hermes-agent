# Torro Agent Framework Configuration
# This file contains all environment-specific settings for the Torro agent system.

[GENERAL]
# Application name
app_name = Torro Agent Framework

# Environment: DEV, UAT, PROD
environment = DEV

# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = INFO

# Coordinator mode: enable dynamic agent spawning
coordinator_mode = true


[OPENAI_API]
# OpenAI-compatible API configuration
# Provider: OpenAI, Azure, vLLM, Ollama, etc.
provider = OpenAI Compatible

# Base URL for the API endpoint
base_url = http://192.168.3.139:8000/v1

# API Key for authentication (replace with your actual API key)
api_key = empty
# Model name to use for completions
model = Intel/Qwen3.5-397B-A17B-int4-AutoRound

# Maximum tokens for completion
max_tokens = 262144

# Temperature for sampling (0.0-2.0)
temperature = 1.0

# Top-p for nucleus sampling
top_p = 0.9

# Request timeout in seconds
timeout = 120


[MEMORY]
# Memory configuration
# Provider: builtin, vector, graph
provider = builtin

# Maximum memories to retrieve
top_k = 5

# Memory retention days
retention_days = 30


[CONTEXT]
# Context engine configuration
# Engine: builtin, lcm, summary
engine = builtin

# Maximum tokens before compression
max_tokens = 4096

# Compression ratio (0.0-1.0)
compression_ratio = 0.8

# Preserve system prompt during compression
preserve_system_prompt = true


[AUTODREAM]
# AutoDream consolidation configuration
# Time gate in hours between consolidations
time_gate_hours = 24

# Session gate: number of sessions before consolidation
session_gate_count = 5


[SRE]
# Site Reliability Engineering configuration
# Enable heartbeat monitor
heartbeat_enabled = true

# Heartbeat interval in seconds
heartbeat_interval = 30

# Enable circuit breaker
circuit_breaker_enabled = true

# Circuit breaker threshold
circuit_breaker_threshold = 5


[CHECKPOINTS]
# Checkpoint configuration
# Storage: file, memory
storage = file

# Storage directory
storage_dir = /tmp/torro_checkpoints

# Maximum checkpoint age in hours
max_age_hours = 24

# Maximum number of checkpoints to keep
max_checkpoints = 100


[SECURITY]
# Security configuration
# Enable tool permissions
tool_permissions_enabled = true

# Enable credential rotation
credential_rotation_enabled = true

# Credential rotation interval in hours
credential_rotation_interval = 24


[CLI_MODELS]
# CLI model registry - defines available AI models for interactive CLI
# Model format: provider|model_name|base_url

# Default interactive model (fast, local)
default = local_qwen25_7b
# Swarm/complex model (large, multi-model discussion)
swarm = local_qwen35_397b

# Local models (Ollama/LM Studio)
local_qwen25_7b = ollama|qwen2.5:7b|http://localhost:11434
local_qwen35_397b = ollama|qwen3.5:397b|http://localhost:11434
local_llama31_8b = ollama|llama3.1:8b|http://localhost:11434

# Cloud models (OpenAI-compatible API) - Add your real cloud models here
# Example:
# cloud_gpt4o = openai|gpt-4o|https://api.openai.com/v1
# cloud_claude = openai|claude-sonnet-4-20250514|https://api.anthropic.com/v1

# Model metadata
# Format: context_window|supports_streaming|supports_images|supports_reasoning
meta_local_qwen25_7b = 32768|true|false|false
meta_local_qwen35_397b = 262144|true|false|true
meta_local_llama31_8b = 131072|true|false|false

# Swarm configuration
# When enabled, uses multiple models for discussion/debate
swarm_enabled = true
swarm_min_models = 2
swarm_max_models = 4
swarm_strategy = debate
